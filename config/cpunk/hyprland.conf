# CpUnk session for Ubuntu / Hyprland 0.53.3.
monitor = , preferred, auto, 1
$mod = SUPER
env = GSK_RENDERER,cairo
env = GTK_THEME,Yaru-red-dark
env = XCURSOR_THEME,Yaru
env = XCURSOR_SIZE,24
exec-once = @HOME@/.local/bin/cpunk-services
# Use software cursors to avoid a stuck pointer on this NVIDIA setup.
cursor {
    no_hardware_cursors = 1
}
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}
general {
    gaps_in = 3
    gaps_out = 3
    border_size = 3
    col.active_border = rgb(000000) rgb(000000) rgb(000000) rgb(aaacac) rgb(000000) rgb(000000) rgb(000000) rgb(aaacac) 25deg
    col.inactive_border = rgb(000000)
    layout = dwindle
    resize_on_border = true
}
decoration {
    rounding = 0
    active_opacity = 1.0
    inactive_opacity = 1.0
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}
animations {
    enabled = false
}
dwindle {
    preserve_split = true
}
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    disable_hyprland_guiutils_check = true
}
xwayland {
    force_zero_scaling = true
}
bind = $mod, SPACE, exec, @HOME@/.local/bin/cpunk-launcher
bind = $mod ALT, SPACE, exec, @HOME@/.local/bin/cpunk-menu
bind = CTRL ALT, T, exec, @HOME@/.local/bin/cpunk-terminal
bind = $mod, RETURN, exec, @HOME@/.local/bin/cpunk-terminal
bind = CTRL ALT SHIFT, T, exec, env GSK_RENDERER=cairo ptyxis --standalone
bind = $mod, E, exec, nautilus
bind = $mod, B, exec, brave-browser
bind = $mod, Q, killactive,
bind = $mod, F, fullscreen, 0
bind = $mod, V, togglefloating,
bind = $mod, L, exec, hyprlock -c @HOME@/.config/cpunk/hyprlock.conf
bind = $mod, K, exec, xdg-open "@HOME@/.local/share/cpunk/handbook.html"
bind = $mod SHIFT, R, exec, hyprctl reload
bind = $mod SHIFT, E, exec, @HOME@/.local/bin/cpunk-menu
bind = , Print, exec, @HOME@/.local/bin/cpunk-screenshot
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = $mod, left, movefocus, l
bind = $mod SHIFT, left, movewindow, l
bind = $mod CTRL, left, resizeactive, -40 0
bind = $mod, right, movefocus, r
bind = $mod SHIFT, right, movewindow, r
bind = $mod CTRL, right, resizeactive, 40 0
bind = $mod, up, movefocus, u
bind = $mod SHIFT, up, movewindow, u
bind = $mod CTRL, up, resizeactive, 0 -40
bind = $mod, down, movefocus, d
bind = $mod SHIFT, down, movewindow, d
bind = $mod CTRL, down, resizeactive, 0 40
bind = $mod, 1, workspace, 1
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod, 2, workspace, 2
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod, 3, workspace, 3
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod, 4, workspace, 4
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod, 6, workspace, 6
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod, 7, workspace, 7
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod, 8, workspace, 8
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 9, movetoworkspace, 9

bind = $mod SHIFT, V, exec, @HOME@/.local/bin/cpunk-clipboard
